name: Build FilzaBrowse IPA

on:
  # trigger manually from the Actions tab (works from mobile browser)
  workflow_dispatch:
  # also trigger on any push to main
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest   # free macOS runner with Xcode 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project FilzaBrowse.xcodeproj \
            -scheme FilzaBrowse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ${{ github.workspace }}/build/FilzaBrowse.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || true

      - name: Package IPA
        run: |
          APP_PATH="${{ github.workspace }}/build/FilzaBrowse.xcarchive/Products/Applications/FilzaBrowse.app"
          IPA_DIR="${{ github.workspace }}/build/ipa"
          
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"
          
          cd "$IPA_DIR"
          zip -qr "${{ github.workspace }}/build/FilzaBrowse_unsigned.ipa" Payload/
          
          echo "=== IPA built ==="
          ls -lh "${{ github.workspace }}/build/FilzaBrowse_unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaBrowse_unsigned_ipa
          path: build/FilzaBrowse_unsigned.ipa
          retention-days: 7   # available for download for 7 days
