name: Build FilzaBrowse IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List targets
        run: xcodebuild -project FilzaBrowse.xcodeproj -list

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FilzaBrowse.xcodeproj \
            -target FilzaBrowse \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OBJROOT=${{ github.workspace }}/build \
            SYMROOT=${{ github.workspace }}/build \
            build

      - name: Package IPA
        run: |
          APP_PATH="${{ github.workspace }}/build/Release-iphoneos/FilzaBrowse.app"
          IPA_DIR="${{ github.workspace }}/build/ipa"

          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"
          zip -qr "${{ github.workspace }}/build/FilzaBrowse_unsigned.ipa" Payload/

          echo "=== IPA built ==="
          ls -lh "${{ github.workspace }}/build/FilzaBrowse_unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaBrowse_unsigned_ipa
          path: build/FilzaBrowse_unsigned.ipa
          retention-days: 7
